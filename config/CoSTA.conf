# CoSTA.conf

# Last Edit: 10/01/2026

# Nodes & Bus
NODE_IDS="1 2 3 4 5 6 7 8"
PORT="/dev/serial0"             # RS485 HAT
BAUD=9600                       # must match RS485Serial.begin() on the XIAOs

# GPIO
LED_GPIO=23                     # physical pin 16
RELAY_GPIO=27                   # physical pin 13, chain A, 1-4
RELAY2_GPIO=22			# physical pin 15, chain B, 5-8
RELAY_ACTIVE="high"             # "high" = relay on , "low"  = active-low relay module

# Timing (seconds)
BOOT_MIN=2                      # Xiao Boot
POLL_TIMES="17 34 51"           # to be changed based on actual cycle length
POLL_TIMEOUT=2                  # max wait for one node's answer
CM_WAIT=3                       # wait after a CM command before asking with CS

# Quality Control (Must match XIAO code)
T_SAMPLES=20                    # readings per burst
EC_SAMPLES=20                   # readings per burst
FAIL=999999                     # invalid reading = READ_FAIL on XIAO

# Calculations 
P_DBAR=0                        # sea pressure for salinity [dbar], nominal depth
VCC=3.3                         # divider supply [V]
R_BALANCE=10000                 # fixed resistor [Ohm]
R25=10000                       # thermistor resistance at 25 C [Ohm]
# Following replaced after calibration
SH_A=3.3540154E-03
SH_B=2.5627725E-04
SH_C=2.0829210E-06              # calibration fit with 3 terms: SH_C=0
SH_D=7.3003206E-08

# Calibration (CoSTA_calibration.sh)
CAL_INSERTIONS=3                # independent insertions = probes out, cleaned, back in, per point
CAL_CYCLES=5                    # CoSTA cycles w/ 20 reading bursts per insertion

# Files & Folders
COSTA_USER="kaja"
COSTA_DIR="/home/kaja/CoSTA"
CALC_SCRIPT="/home/kaja/CoSTA/CoSTA_calc.py"
WITTYPI_DIR="/home/kaja/wittypi"
SCHEDULE="CoSTA_monitor.wpi"      # Schedules
USBID="sda1"                      # USB stick
DATA_DIR="/media/DATA"            # USB mount point
RUNFILE="CoSTA.log"               # step log of CoSTA.sh
RAWFILE="CoSTA_raw.csv"           # raw bursts as sent by the XIAOs
CALCFILE="CoSTA_calc.csv"         # run flags, N, mean, SD, SEM, salinity
CALIBFILE="CoSTA_calibration.log" # EZO commands + answers, run sheet of the 3x5x20 runs

# Temperature Calibration Coefficients
TCAL_1="3.3 10000 3.36674164E-03 2.58667976E-04 0 -1.16524875E-05"
TCAL_2="3.3 10000 3.36603940E-03 2.61342585E-04 0 -2.15631067E-05"
TCAL_3="3.3 10000 3.36486360E-03 2.60083625E-04 0 -1.80284272E-05"
TCAL_4="3.29 10000 3.36592028E-03 2.58526004E-04 0 -7.24896366E-06"
TCAL_5="3.3 10000 3.36277020E-03 2.56703705E-04 0 -1.18769265E-06"
TCAL_6="3.29 10000 3.36248320E-03 2.57426768E-04 0 -7.98857881E-08"
TCAL_7="3.3 10000 3.36620078E-03 2.59095618E-04 0 -6.75351295E-06"
TCAL_8="3.28 10000 3.36298867E-03 2.57392206E-04 0 -6.20379221E-06"

